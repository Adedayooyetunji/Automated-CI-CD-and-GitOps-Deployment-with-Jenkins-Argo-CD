apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-nonprod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
          - environment: staging
  template:
    metadata:
      name: sample-app-{{environment}}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Adedayooyetunji/Automated-CI-CD-and-GitOps-Deployment-with-Jenkins-Argo-CD.git
        targetRevision: gitops/auto
        path: gitops-config/overlays/{{environment}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: prod
  template:
    metadata:
      name: sample-app-{{environment}}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Adedayooyetunji/Automated-CI-CD-and-GitOps-Deployment-with-Jenkins-Argo-CD.git
        targetRevision: gitops/auto
        path: gitops-config/overlays/{{environment}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
